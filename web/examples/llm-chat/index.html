<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM chat</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --me: #e0f2fe; --bot: #fff; --accent: #0369a1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --me: #0c4a6e; --bot: #292524; --accent: #7dd3fc; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  select, button, textarea { font: inherit; color: inherit; background: var(--bot); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  label { color: var(--muted); font-size: 13px; display: flex; gap: 4px; align-items: center; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 760px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--me); }
  .assistant { align-self: flex-start; background: var(--bot); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .tool { color: var(--muted); font-size: 13px; align-self: flex-start; font-family: ui-monospace, monospace; }
  .error { color: #b91c1c; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: vertical; min-height: 44px; }
  #status { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>LLM chat</h1>
  <label>Model <select id="model"><option value="">tier default</option></select></label>
  <label>Effort <select id="effort"><option value="">—</option><option>low</option><option>medium</option><option>high</option></select></label>
  <label><input type="checkbox" id="tools" checked> tools</label>
  <button id="clear" type="button">New chat</button>
  <span id="status">connecting…</span>
</header>
<main id="log"></main>
<form id="form">
  <textarea id="input" placeholder="Ask something. Enter sends, Shift+Enter is a new line." disabled></textarea>
  <button class="primary" id="send" disabled>Send</button>
  <button id="stop" type="button" hidden>Stop</button>
</form>
<script>
// A chat on the sample capability: multi-turn history, streaming, a model
// and effort picker from sample.limits(), page tools, and Stop.
const $ = (id) => document.getElementById(id);
const log = $("log");
let history = []; // [{role, content}], ending on a user turn when sent
let ctrl = null;

// Page tools: they run here, in the page; the model sees their results.
const pageTools = [
  { name: "get_time", description: "The current date and time in the viewer's browser.",
    execute: () => ({ now: new Date().toString() }) },
  { name: "roll_dice", description: "Roll n dice with the given number of sides.",
    inputSchema: { type: "object", properties: { n: { type: "integer" }, sides: { type: "integer" } }, required: ["n", "sides"] },
    execute: ({ n, sides }) => Array.from({ length: Math.min(n, 100) }, () => 1 + Math.floor(Math.random() * sides)) },
  { name: "calculate", description: "Evaluate an arithmetic expression (+ - * / parentheses).",
    inputSchema: { type: "object", properties: { expression: { type: "string" } }, required: ["expression"] },
    execute: ({ expression }) => {
      if (!/^[\d\s+\-*/().]+$/.test(expression)) throw new Error("only numbers and + - * / ( )");
      return Function(`"use strict"; return (${expression})`)();
    } },
];

function add(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function busy(on) {
  $("send").disabled = on; $("input").disabled = on; $("stop").hidden = !on;
}

(async () => {
  const sample = await claude.use("sample");
  if (!sample) { $("status").textContent = "sample is not available here (admins only, and the server needs --models pi)"; return; }
  const limits = await sample.limits();
  for (const m of limits.models || []) {
    const o = document.createElement("option");
    o.value = m.provider + "/" + m.id;
    o.textContent = o.value + (m.tier ? ` (${m.tier})` : "");
    $("model").append(o);
  }
  $("status").textContent = `${(limits.models || []).length} models`;
  $("input").disabled = false; $("send").disabled = false; $("input").focus();

  $("clear").onclick = () => { history = []; log.replaceChildren(); };
  $("stop").onclick = () => ctrl?.abort();
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    $("input").value = "";
    add("msg user", text);
    history.push({ role: "user", content: text });
    const out = add("msg assistant", "…");
    const started = performance.now();
    ctrl = new AbortController();
    busy(true);
    // Turns are plain text, so a later turn only knows what earlier turns
    // say: keep each tool call and its result in the stored assistant turn.
    const used = [];
    const opts = {
      signal: ctrl.signal, cache: false,
      onText: ({ text }) => { out.textContent = text; log.scrollTop = log.scrollHeight; },
      tools: $("tools").checked ? pageTools.map((t) => ({ ...t, execute: async (input) => {
        out.before(add("tool", `⚙ ${t.name}(${JSON.stringify(input)})`)); // above the reply it feeds
        try {
          const result = await t.execute(input);
          used.push(`${t.name}(${JSON.stringify(input)}) → ${JSON.stringify(result)}`);
          return result;
        } catch (err) {
          used.push(`${t.name}(${JSON.stringify(input)}) → error: ${err.message}`);
          throw err;
        }
      } })) : undefined,
    };
    if ($("model").value) opts.model = $("model").value;
    if ($("effort").value) opts.effort = $("effort").value;
    try {
      const r = await sample(history, opts);
      out.textContent = r.text;
      history.push({ role: "assistant", content: used.length ? `[tools used: ${used.join("; ")}]\n\n${r.text}` : r.text });
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${r.modelApplied || r.modelTierApplied}${r.truncated ? " · truncated" : ""} · ${Math.round(performance.now() - started)} ms`;
      out.append(meta);
    } catch (err) {
      out.classList.add("error");
      out.textContent = `${err.code || "error"}: ${err.message}` + (err.text ? `\n\n(partial) ${err.text}` : "");
      history.pop(); // drop the unanswered user turn so turns stay user/assistant
    } finally {
      busy(false); ctrl = null; $("input").focus();
    }
  };
})();
</script>
</body>
</html>
