<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contacts</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 2rem; color: #222; }
  li { display: flex; align-items: center; gap: .6rem; margin: .4rem 0; }
  img { width: 32px; height: 32px; border-radius: 4px; }
</style>
</head>
<body>
<!-- Written as a claude.ai artifact would be: only claude.use('db'). It has
     no idea that "contacts" lives in another store (SLOP3-008 aliases). -->
<h1>Contacts</h1>
<ul id="list"></ul>
<p id="status">Loading…</p>
<form id="add"><input id="note" placeholder="A note"> <button>Add note</button></form>
<ul id="notes"></ul>
<script>
(async () => {
  const db = await window.claude.use('db');
  const status = document.getElementById('status');
  if (!db) { status.textContent = 'No database here.'; return; }
  db.collection('contacts').orderBy('name').onSnapshot((snap) => {
    const list = document.getElementById('list');
    list.textContent = '';
    for (const d of snap.docs) {
      const c = d.data();
      const li = document.createElement('li');
      if (c.photo) {
        const img = new Image();
        img.src = '/_blob/' + c.photo;
        img.alt = c.name;
        li.append(img);
      }
      li.append(document.createTextNode(c.name));
      list.append(li);
    }
    status.textContent = snap.size + (snap.size === 1 ? ' contact' : ' contacts');
  });
  db.collection('notes').onSnapshot((snap) => {
    const ul = document.getElementById('notes');
    ul.textContent = '';
    for (const d of snap.docs) {
      const li = document.createElement('li');
      li.textContent = d.data().text;
      ul.append(li);
    }
  });
  document.getElementById('add').onsubmit = async (e) => {
    e.preventDefault();
    const text = document.getElementById('note').value.trim();
    if (text) await db.collection('notes').add({ text, at: Date.now() });
  };
})();
</script>
</body>
</html>
