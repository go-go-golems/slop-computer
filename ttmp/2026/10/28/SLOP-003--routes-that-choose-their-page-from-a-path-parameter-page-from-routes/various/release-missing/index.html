<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No such release</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 36rem; margin: 15vh auto; padding: 0 16px; color: #1a1a1a; }
  code { background: #f2f2f2; padding: 0 4px; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>No release here</h1>
<p id="what">There is no release at this address.</p>
<p><a href="/">Back to the catalogue</a></p>
<script>
  var name = (window.slop && slop.route && slop.route.params && slop.route.params.page) || '';
  if (name) {
    var p = document.getElementById('what');
    p.textContent = 'There is no release called ';
    var c = document.createElement('code'); c.textContent = name; p.appendChild(c);
    p.appendChild(document.createTextNode('.'));
  }
</script>
</body>
</html>
