# Builds and tests on pull requests; on main, publishes
# ghcr.io/go-go-golems/slop-computer:sha-<short> (SLOP-002) and opens a PR in
# the k3s GitOps repo that pins the slop deployment to it
# (deploy/gitops-targets.json). The PR is opened as the GitOps GitHub App,
# whose credential the Vault role slop-computer-gitops-pr may read
# (wesen/terraform, vault/github-actions/envs/k3s), on main pushes only.
name: publish-image

on:
  pull_request:
  push:
    branches:
      - main
    # Documentation and ticket changes do not change the container.
    paths-ignore:
      - "ttmp/**"
      - "*.md"
      - "doc/**"
  workflow_dispatch:

# The reusable workflow declares these four; a caller that grants less gets
# a startup_failure.
permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: go-go-golems/infra-tooling/.github/workflows/publish-ghcr-image.yml@main
    secrets: inherit
    with:
      dockerfile: ./Dockerfile
      build_context: .
      test_command: go test ./... -count=1 && SLOP_TEST_ACTORS_RUNTIME=direct go test ./pkg/host/ -count=1
      go_version_file: go.mod
      image_name: ghcr.io/go-go-golems/slop-computer
      platforms: linux/amd64
      push_image: ${{ github.event_name != 'pull_request' }}
      gitops_target_config: deploy/gitops-targets.json
      open_gitops_pr: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      gitops_pr_token_source: github_app
      vault_role: slop-computer-gitops-pr
      gitops_app_secret_path: kv/data/ci/github/slop-computer/gitops-pr-app
      gitops_app_owner: wesen
      gitops_app_repositories: 2026-03-27--hetzner-k3s
      tooling_repository: go-go-golems/infra-tooling
      tooling_ref: main
