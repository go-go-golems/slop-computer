---
# This file contains the configuration for golangci-lint
# See https://golangci-lint.run/usage/configuration/ for reference

# Defines the configuration version.
# The only possible value is "2".
version: "2"

# Linters configuration
linters:
  # Default set of linters.
  default: none
  # Enable specific linters
  enable:
    # defaults
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # additional linters
    - exhaustive
    #    - gochecknoglobals
    #    - gochecknoinits
    - nonamedreturns
    - predeclared
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln

# Report every finding: the default caps (3 per identical message, 50 per
# linter) hid 29 unchecked rows.Close calls behind 3.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Formatters configuration
formatters:
  enable:
    - gofmt
