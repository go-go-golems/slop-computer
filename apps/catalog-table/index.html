<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table — slop catalog</title>
<link rel="stylesheet" href="/catalog/kit/views.css">
<style>
  .capf { display: flex; flex-wrap: wrap; border: 1px solid var(--hair); }
  .capf button { height: calc(var(--control-h) - 2px); border: 0; border-left: 1px solid var(--hair); background: var(--bg); padding: 0 9px; font: 12px var(--mono); cursor: pointer; color: var(--ink-2); }
  .capf button:first-child, .capf > :not(button) + button { border-left: 0; }
  .capf > :not(button) { align-self: center; padding: 0 8px; font: 11px var(--mono); color: var(--ink-2); border-right: 1px solid var(--hair); line-height: calc(var(--control-h) - 2px); }
  .capf button:hover { color: var(--ink); }
  .capf button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .scroll { overflow-x: auto; border-top: 1px solid var(--ink); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--bg); font: 500 11px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; border-bottom: 1px solid var(--hair); }
  th:hover { color: var(--ink); }
  th[aria-sort] { color: var(--ink); }
  th[aria-sort="ascending"]::after { content: " ↑"; }
  th[aria-sort="descending"]::after { content: " ↓"; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-size: 13px; }
  td.cap, th.cap { text-align: center; padding-right: 0; }
  td.cap { font-family: var(--mono); color: var(--hair); }
  td.cap.on { color: var(--ink); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--fill); }
  td.title { font-weight: 700; white-space: normal; min-width: 200px; }
  td.title small { display: block; font-weight: 400; color: var(--ink-2); max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="head"></div>
<main class="wrap">
  <div class="bar">
    <h1 id="count">Apps</h1>
    <div class="capf" id="caps" role="group" aria-label="Needs capability"></div>
  </div>
  <div id="pgt"></div>
  <div class="scroll"><table id="t"><thead></thead><tbody><tr><td class="cv-empty">Loading the catalog…</td></tr></tbody></table></div>
  <div id="pgb"></div>
</main>
<footer class="cv-foot"><div class="wrap">Click a column to sort; click a row to view. Columns sample · db · room · user · downloads are the runtime capabilities each app declares.</div></footer>
<script src="/catalog/kit/views.js"></script>
<script>
(async () => {
  const { el, bytes, date, matches, paged } = SlopCatalog;
  const PER_PAGE = 50;
  await SlopCatalog.header(document.querySelector("#head"), "table");
  const { catalog } = await SlopCatalog.load();
  SlopCatalog.viewer.bind(catalog);
  const CAPS = ["sample", "db", "room", "user", "downloads"];
  const cols = [
    { key: "title", label: "App", get: (i) => i.title.toLowerCase() },
    ...CAPS.map((c) => ({ key: c, label: c, cap: true, get: (i) => (i.capabilities.includes(c) ? 1 : 0) })),
    { key: "access", label: "Access", get: (i) => (i.free ? 0 : 1) },
    { key: "version", label: "Version", get: (i) => i.version || "" },
    { key: "published", label: "Published", get: (i) => i.publishedAt || "" },
    { key: "size", label: "Size", num: true, get: (i) => i.bytes },
    { key: "files", label: "Attachments", num: true, get: (i) => i.attachments.length },
  ];
  const params = new URLSearchParams(location.search);
  const state = { by: params.get("by") || "published", dir: params.get("dir") === "asc" ? 1 : -1, q: params.get("q") || "", need: new Set() };
  window.addEventListener("catalog:search", (e) => { state.q = e.detail.query; paged.reset(); render(); });

  function keep() {
    const u = new URL(location.href);
    u.searchParams.set("by", state.by);
    u.searchParams.set("dir", state.dir > 0 ? "asc" : "desc");
    history.replaceState(history.state, "", u);
  }

  function head() {
    document.querySelector("#t thead").replaceChildren(el("tr", {}, cols.map((c) => el("th", {
      class: c.num ? "num" : c.cap ? "cap" : null, scope: "col",
      "aria-sort": state.by === c.key ? (state.dir > 0 ? "ascending" : "descending") : null,
      onclick: () => { state.dir = state.by === c.key ? -state.dir : (c.key === "title" ? 1 : -1); state.by = c.key; keep(); paged.reset(); render(); },
    }, c.label))));
    document.querySelector("#caps").replaceChildren(el("span", { class: "cv-meta" }, "needs"), ...CAPS.map((c) => el("button", {
      type: "button", "aria-pressed": state.need.has(c) ? "true" : "false",
      onclick: () => { state.need.has(c) ? state.need.delete(c) : state.need.add(c); paged.reset(); render(); },
    }, c)));
  }

  function render() {
    head();
    const col = cols.find((c) => c.key === state.by) || cols[0];
    const items = catalog.items
      .filter((i) => matches(i, state.q))
      .filter((i) => [...state.need].every((c) => i.capabilities.includes(c)))
      .sort((a, b) => {
        const x = col.get(a), y = col.get(b);
        return (x < y ? -1 : x > y ? 1 : a.title.localeCompare(b.title)) * state.dir;
      });
    document.querySelector("#count").textContent = items.length === catalog.count ? `${catalog.count} apps` : `${items.length} of ${catalog.count} apps`;
    const page = paged(items, PER_PAGE, [document.querySelector("#pgt"), document.querySelector("#pgb")], render);
    document.querySelector("#t tbody").replaceChildren(...page.map((i) => el("tr", { onclick: () => SlopCatalog.viewer.open(i), tabindex: "0",
      onkeydown: (e) => { if (e.key === "Enter") SlopCatalog.viewer.open(i); } },
      el("td", { class: "title" }, i.title, el("small", {}, i.description)),
      CAPS.map((c) => el("td", { class: "cap" + (i.capabilities.includes(c) ? " on" : "") }, i.capabilities.includes(c) ? "●" : "·")),
      el("td", {}, i.free ? "free" : el("span", { class: "cv-paid" }, "subscribers")),
      el("td", { class: "cv-meta" }, i.version || ""),
      el("td", { class: "cv-meta" }, date(i.publishedAt)),
      el("td", { class: "num" }, bytes(i.bytes)),
      el("td", { class: "num" }, i.attachments.length || ""))));
  }
  render();
})();
</script>
</body>
</html>
