  --code-bg: #1d1d1d; --sel: rgba(255, 59, 74, 0.16); --canvas: #121212; --dot: #262626; --good: #3ecf8e; --warn: #f0a83c;
  --a1: #4da3ff; --a2: #a77bff; --a3: #2fc4cf; --a4: #ffb627; --you: #ff3b4a;
  --tok-key: #f2f2f2; --tok-str: #a6a6a6; --tok-num: #f2f2f2; --tok-com: #6e6e6e; --tok-tag: #f2f2f2; --tok-attr: #9a9a9a; color-scheme: dark; } }

  --bg: #1a1a1a; --fill: #222; --fill-2: #3a3a3a; --ink: #f2f2f2; --ink-2: #9a9a9a; --accent: #ff3b4a; --hair: #3d3d3d; --rule: #2a2a2a;

.sp { flex: 1; }

/* dock: tiles, tabs, gutters, drag and drop (form-skate) */

.float > .fhead small { font-weight: 400; color: var(--ink-2); }
.float > .fbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* toolbars and blocks */
.toolbar { flex: none; min-height: 40px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 8px; padding: 5px 10px; flex-wrap: wrap; }
.toolbar .lbl { color: var(--ink-2); font-size: var(--fs-xs); white-space: nowrap; }
.scroll { overflow: auto; overscroll-behavior: contain; flex: 1; min-height: 0; }
.block { padding: 10px 14px 12px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 6px; }
.block > header { display: flex; align-items: center; gap: 8px; }

/* canvas */

.frm > .fh .route { font-weight: 700; background: none; border: 1px solid transparent; padding: 1px 4px; flex: 0 1 auto; min-width: 70px; max-width: 150px; border-radius: 0; font-size: var(--fs-s); }

.frm > .fb { position: relative; background: transparent; outline: var(--zb, 1px) solid var(--hair); }
.frm.sel > .fb { outline-color: var(--ink); outline-width: calc(var(--zb, 1px) * 2); }
.frm.prop > .fb { outline: calc(var(--zb, 1px) * 2) dashed var(--a1); }
.frm.prop > .fh .route { color: var(--a1); }
.frm iframe { display: block; border: 0; background: transparent; }
.frm .fstatus { position: absolute; right: 6px; bottom: 6px; background: var(--accent); color: #fff; font-size: var(--fs-xs); padding: 2px 6px; pointer-events: none; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cvhud { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; align-items: center; z-index: 4; }
.cvhud .chip, .chip { font: 700 10px/1 var(--code); letter-spacing: .06em; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); padding: 5px 8px; text-transform: uppercase; }
.chip.on { background: var(--ink); color: var(--bg); }
.pinpop { position: absolute; z-index: 6; background: var(--bg); border: 1px solid var(--ink); padding: 8px; width: 260px; display: flex; flex-direction: column; gap: 6px; }
.pinpop textarea { min-height: 54px; resize: vertical; }

/* code view */
.cview { flex: 1; min-height: 0; display: flex; }
.flist { width: 190px; flex: none; border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; }
.flist .fl { flex: 1; overflow: auto; padding: 4px 0; }
.flist .fi, .tlist .fi { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; padding: 3px 10px; text-align: left; font: 400 var(--fs-s)/1.5 var(--code); border-radius: 0; white-space: nowrap; }
.flist .fi:hover, .tlist .fi:hover { background: var(--fill); }
.flist .fi.on, .tlist .fi.on { font-weight: 700; box-shadow: inset 2px 0 0 var(--accent); }
.flist .fi .ch, .tlist .fi .ch { color: var(--a1); font-size: var(--fs-xs); margin-left: auto; }
.tlist .fi .ch { color: var(--ink-2); }
.flist .fi.dir { color: var(--ink-2); font-family: var(--ui); font-size: var(--fs-xs); padding-top: 8px; }
.cmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ftop { display: flex; align-items: stretch; flex: none; border-bottom: 1px solid var(--hair); }
.ftop > .ftabs { flex: 1; min-width: 0; border-bottom: 0; }
.fbtn { display: none; margin: 4px 6px; flex: none; }
/* a narrow Code view: the list is 130 px, and hides behind "Files" while a file is open (after .flist, so it wins) */
@container (max-width: 640px) {
  .flist { width: 130px; }
  .cview.hasfile .fbtn { display: inline-block; }
  .cview.hasfile:not(.showfiles) .flist { display: none; }
  .cview.showfiles .fbtn { background: var(--fill); }
  .efoot { gap: 6px 8px; padding: 4px 8px; }
}
.ftabs { display: flex; align-items: stretch; height: 34px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; flex: none; }
.ftab { display: inline-flex; align-items: stretch; flex: none; }
.ftab button { background: none; border: 0; padding: 0 4px 0 10px; font: 400 var(--fs-s) var(--code); color: var(--ink-2); white-space: nowrap; border-radius: 0; }
.ftab.on button { color: var(--ink); font-weight: 700; } .ftab.on { box-shadow: inset 0 -1px 0 var(--ink); }
.ftab .x { padding: 0 8px 0 2px; opacity: .5; } .ftab .x:hover { opacity: 1; color: var(--accent); }
.ed { position: relative; flex: 1; min-height: 80px; display: flex; background: var(--code-bg); overflow: hidden; }
.egutter { width: 48px; flex: none; overflow: hidden; border-right: 1px solid var(--hair); color: var(--tok-com); text-align: right; position: relative; }
.egutter .gin { padding: 10px 8px 40px 0; font: 400 12px/18px var(--code); }
.egutter .gin div.hit { color: var(--accent); font-weight: 700; }
.egutter .gin div.terr { color: var(--accent); text-decoration: underline wavy var(--accent); text-underline-offset: 3px; cursor: help; }
.efoot .terr { color: var(--accent); }
.efoot .tinfo { opacity: .8; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code pre, .code textarea { position: absolute; inset: 0; margin: 0; padding: 10px 14px 40px 12px; font: 400 12px/18px var(--code); white-space: pre; tab-size: 2; border: 0; letter-spacing: 0; }
.code pre { pointer-events: none; color: var(--ink); overflow: visible; right: auto; bottom: auto; min-width: 100%; min-height: 100%; }
.code textarea { background: transparent; color: transparent; caret-color: var(--accent); resize: none; overflow: auto; outline: none; -webkit-text-fill-color: transparent; border-radius: 0; }
.code textarea::selection { background: var(--sel); -webkit-text-fill-color: transparent; }
.code textarea[readonly] { caret-color: transparent; }
.tk-k { color: var(--tok-key); font-weight: 700; } .tk-s { color: var(--tok-str); } .tk-n { color: var(--tok-num); }

#toast button { pointer-events: auto; margin-left: 8px; } /* an action in a toast (Undo) takes clicks; the rest lets them through */
.boot { flex: 1; display: grid; place-items: center; color: var(--ink-2); }
/* fixtures, recording, snapshots, scenarios */

.recbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--bg); border-top: 2px solid var(--accent); font-size: 11.5px; z-index: 3; }
.recbar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: recblink 1.2s infinite; flex: none; }
.recbar > span:not(.dot):not(.sp) { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@keyframes recblink { 50% { opacity: .25 } }
.snapstrip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.snapstrip .snap { background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; border-radius: 0; cursor: pointer; }
.snapstrip .snap:hover > div:first-child { outline: 2px solid var(--a1); }

.checks .sres { display: flex; gap: 8px; align-items: baseline; font-size: var(--fs-s); padding: 2px 0; }
.checks .sres.ok > span:first-child { color: var(--good); } .checks .sres.bad > span:first-child { color: var(--accent); }
.scard { border-bottom: 1px solid var(--hair); padding: 8px 12px; }

.si.ok { color: var(--good); } .si.bad { color: var(--accent); } .si.run { color: var(--a1); animation: recblink 1s infinite; } .si.none { color: var(--ink-2); }
.ssteps { margin: 6px 0 2px 26px; padding: 0; list-style: none; font: 400 11.5px/1.55 var(--code); }
.ssteps li { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ssteps li .m { width: 12px; flex: none; }
.ssteps li.ok .m { color: var(--good); } .ssteps li.bad .m, .ssteps li.bad > span:nth-child(2) { color: var(--accent); } .ssteps li.run .m { color: var(--a1); } .ssteps li.todo { color: var(--ink-2); }

.chat .summary { border: 1px solid var(--hair); border-left: 3px solid var(--a1); padding: 8px 10px; margin: 4px 0 10px; background: var(--fill); }
.chat .summary .who { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: var(--fs-xs); color: var(--ink-2); margin-bottom: 4px; }
.chat .summary .who > * { white-space: nowrap; }

.chat .summary .md { font-size: 12.5px; max-height: 240px; overflow-y: auto; }
.chat .sumcut { text-align: center; font-size: var(--fs-xs); color: var(--a1); border-top: 1px dashed var(--a1); margin: 10px 0; padding-top: 4px; }
/* panels */
:root { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; } }
:root[data-theme="dark"] { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; }
.panel { border: 1px solid var(--hair); background: var(--bg); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; }
.view > div > .scroll > .panel { margin: 10px 12px; }

/* controls in the shell's terms: ink on paper, square, no tint */
.panel input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 0; background: transparent; cursor: ew-resize; --p: 50%; }
.panel input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--ink) 0 var(--p), var(--hair) var(--p) 100%); }
.panel input[type=range]::-moz-range-track { height: 2px; background: var(--hair); }

.panel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 18px; margin-top: -8px; background: var(--ink); border: 0; border-radius: 0; }
.panel input[type=range]::-moz-range-thumb { width: 10px; height: 18px; background: var(--ink); border: 0; border-radius: 0; }
.panel input[type=range]:active::-webkit-slider-thumb, .panel input[type=range]:focus-visible::-webkit-slider-thumb { background: var(--accent); }
.panel input[type=range]:active::-moz-range-thumb, .panel input[type=range]:focus-visible::-moz-range-thumb { background: var(--accent); }
.panel input[type=range]:focus-visible { outline: none; }
.panel input[type=checkbox] { -webkit-appearance: none; appearance: none; justify-self: start; position: relative; width: 30px; height: 16px; margin: 0; border: 1.5px solid var(--ink); border-radius: 0; background: var(--bg); cursor: pointer; }
.panel input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; background: var(--ink); transition: left .12s; }
.panel input[type=checkbox]:checked { background: var(--ink); }
.panel input[type=checkbox]:checked::after { left: 16px; background: var(--bg); }
.panel input[type=checkbox]:focus-visible, .panel input[type=color]:focus-visible { outline: 1px dashed var(--ink); outline-offset: 2px; }
.panel input[type=color] { -webkit-appearance: none; appearance: none; justify-self: start; width: 40px; height: 20px; padding: 0; border: 1.5px solid var(--ink); border-radius: 0; background: none; cursor: pointer; }
.panel input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.panel input[type=color]::-webkit-color-swatch { border: 0; border-radius: 0; }
.panel input[type=color]::-moz-color-swatch { border: 0; border-radius: 0; }
.panel .prow select, .panel .prow input:not([type]) { border-radius: 0; border: 1.5px solid var(--ink); background: var(--bg); color: var(--ink); font: inherit; padding: 2px 6px; }
.panel .prow select, .panel .prow input:not([type]) { width: 100%; }
.panel .pv { font: 400 11.5px var(--code); color: var(--ink); min-width: 44px; text-align: right; }
.panel .pl { font-size: var(--fs-xs); color: var(--ink-2); }

.panel .pw .big { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--ink); }
.panel .ptable { max-height: 220px; overflow: auto; }
.panel table.grid.ro td { padding: 3px 8px; font: 400 11.5px var(--code); }
.panel .plist { margin: 0; padding-left: 18px; font-size: var(--fs-s); }
.panel .pfoot { display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--hair); padding-top: 6px; flex-wrap: wrap; }
.panel .prun { font-size: var(--fs-s); border-top: 1px dashed var(--hair); padding-top: 4px; }
.panel .prun pre { margin: 2px 0 0; font-size: 11px; white-space: pre-wrap; max-height: 140px; overflow: auto; }
.panel .prun.bad b { color: var(--accent); }
.pchart { position: relative; }
.pchart svg { display: block; overflow: visible; max-height: 150px; }
.pchart .grid { stroke: var(--rule); stroke-width: 1; }
.pchart .base { stroke: var(--hair); stroke-width: 1; }
.pchart .tick { font: 400 9px var(--sans, system-ui); fill: var(--ink-2); }
.pchart .bar { fill: var(--series-1); }

.pchart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.pchart .line.s1, .pchart .dot.s1 { stroke: var(--series-1); } .pchart .line.s2, .pchart .dot.s2 { stroke: var(--series-2); } .pchart .line.s3, .pchart .dot.s3 { stroke: var(--series-3); }
.pchart .dot { fill: var(--bg); stroke-width: 2; }
