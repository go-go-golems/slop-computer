<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop — slop catalog</title>
<link rel="stylesheet" href="/catalog/kit/views.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .desk { position: relative; flex: 1; min-height: 0; overflow: hidden; user-select: none;
          background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, var(--bg); }
  .desk.busy iframe { pointer-events: none; }
  .icons { position: absolute; left: 16px; top: 16px; bottom: 60px; display: flex; flex-direction: column; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .ico { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 4px; border: 1px solid transparent; background: none; color: var(--ink); cursor: pointer; font-size: 12px; text-align: center; }
  .ico:hover, .ico:focus-visible { background: var(--sel); border-color: var(--accent); outline: none; }
  .ico .pic { width: 48px; height: 48px; overflow: hidden; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 700 18px var(--sans); border: 1px solid var(--ink); }
  .ico .pic img { width: 100%; height: 100%; object-fit: cover; }
  .ico span { line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; background: var(--bg); padding: 0 2px; }
  .win { position: absolute; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--ink); overflow: hidden; min-width: 260px; min-height: 160px; }
  .win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 40px) !important; border-width: 0 0 1px; }
  .win.min { display: none; }
  .win .tb { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; flex: none; cursor: grab; background: var(--bg); color: var(--ink); border-bottom: 1px solid var(--ink); }
  .win.focus .tb { background: var(--ink); color: var(--bg); }
  .win .tb b { font-size: 13px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .tb button, .win .tb a { border: 1px solid currentColor; background: transparent; height: 22px; min-width: 24px; font: 12px var(--mono); cursor: pointer; color: inherit; text-decoration: none; display: grid; place-items: center; padding: 0 6px; }
  .win .tb button:hover, .win .tb a:hover { background: var(--bg); color: var(--ink); }
  .win.focus .tb button:hover, .win.focus .tb a:hover { background: var(--bg); color: var(--ink); }
  .win .tb button.x:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .win .body { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--fill); }
  .win .body.doc { overflow: auto; padding: 14px 16px; background: var(--bg); user-select: text; font-size: 14px; }
  .win .grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; background: repeating-linear-gradient(135deg, transparent 0 3px, var(--ink) 3px 4px); }
  .explorer { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .explorer .ico { color: var(--ink); width: auto; }
  .explorer input { grid-column: 1 / -1; height: var(--control-h); border: 1px solid var(--hair); padding: 0 8px; background: var(--bg); }
  .explorer input:focus { outline: none; border-color: var(--ink); }
  .task { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; gap: 0; padding: 0; background: var(--bg); border-top: 1px solid var(--ink); color: var(--ink); z-index: 10000; }
  .task .start { height: 39px; padding: 0 16px; border: 0; border-right: 1px solid var(--ink); font-weight: 700; cursor: pointer; background: var(--ink); color: var(--bg); }
  .task .tasks { flex: 1; display: flex; gap: 0; min-width: 0; overflow: hidden; }
  .task .tasks button { height: 39px; max-width: 180px; min-width: 0; padding: 0 12px; border: 0; border-right: 1px solid var(--hair); background: var(--bg); color: var(--ink-2); cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .tasks button:hover { color: var(--ink); }
  .task .tasks button.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); }
  .task .clock { font: 12px var(--mono); padding: 0 14px; white-space: nowrap; border-left: 1px solid var(--hair); height: 100%; display: grid; place-items: center; }
  .menu { position: absolute; left: 0; bottom: 40px; width: min(380px, 100%); max-height: min(560px, calc(100% - 50px)); display: flex; flex-direction: column;
          background: var(--bg); border: 1px solid var(--ink); border-left: 0; z-index: 10001; overflow: hidden; }
  .menu[hidden] { display: none; }
  .menu input { margin: 10px; height: var(--control-h); border: 1px solid var(--hair); padding: 0 10px; background: var(--bg); }
  .menu input:focus { outline: none; border-color: var(--ink); }
  .menu ul { list-style: none; margin: 0; padding: 0 0 6px; overflow: auto; }
  .menu li { padding: 6px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--rule); }
  .menu li:hover { background: var(--fill); }
  .menu li.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  .menu li small { color: var(--ink-2); font: 11px var(--mono); margin-left: auto; white-space: nowrap; }
  .menu h4 { margin: 10px 12px 4px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
  .note { position: absolute; right: 16px; bottom: 52px; color: var(--ink-2); font: 12px var(--mono); text-align: right; pointer-events: none; }
</style>
</head>
<body>
<div id="head"></div>
<div class="desk" id="desk">
  <div class="icons" id="icons"></div>
  <div class="note" id="note"></div>
  <div class="menu" id="menu" hidden role="dialog" aria-label="Start"></div>
  <div class="task" id="task">
    <button class="start" type="button" id="start" aria-haspopup="dialog">slop</button>
    <div class="tasks" id="tasks"></div>
    <span class="clock" id="clock"></span>
  </div>
</div>
<script src="/catalog/kit/views.js"></script>
<script>
(async () => {
  const { el, bytes, date, monogram, live, matches, fuzzy } = SlopCatalog;
  await SlopCatalog.header(document.querySelector("#head"), "desktop");
  const { catalog, views } = await SlopCatalog.load();
  SlopCatalog.viewer.bind(catalog);
  const desk = document.querySelector("#desk"), tasks = document.querySelector("#tasks"), menu = document.querySelector("#menu");
  const MAX_LIVE = 5; // running app windows at once; older ones fall back to their cover
  const wins = []; // {id, node, item?, stop?, title, min}
  let z = 10, cascade = 0;

  const pic = (item) => el("div", { class: "pic" }, item.cover ? el("img", { src: item.cover.src, alt: "", loading: "lazy" })
    : (item.title || "").replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join(""));

  function focus(w) {
    wins.forEach((x) => x.node.classList.toggle("focus", x === w));
    if (w) { w.node.style.zIndex = ++z; w.min = false; w.node.classList.remove("min"); }
    taskbar();
  }

  function close(w) {
    if (w.stop) w.stop();
    w.node.remove();
    wins.splice(wins.indexOf(w), 1);
    keep();
    taskbar();
  }

  function minimize(w) {
    w.min = true;
    w.node.classList.add("min");
    if (w.item) { w.stop && w.stop(); w.stop = null; }
    taskbar();
  }

  function restore(w) {
    if (w.item && !w.stop) w.stop = live(w.body, w.item, "desktop");
    focus(w);
    budget(w);
  }

  // budget keeps at most MAX_LIVE app windows running; the least recently
  // focused others show their cover until they are focused again.
  function budget(keepW) {
    const running = wins.filter((w) => w.item && w.stop && !w.min).sort((a, b) => (+b.node.style.zIndex) - (+a.node.style.zIndex));
    running.slice(MAX_LIVE).forEach((w) => { if (w !== keepW) { w.stop(); w.stop = null; w.body.replaceChildren(el("div", { class: "cv-livecover", style: "display:grid;place-items:center;font:13px var(--mono)" }, "paused · click to run")); } });
  }

  // drag moves (or, from the grip, resizes) a window with the pointer.
  function drag(w, e, resize) {
    if (e.button !== 0 || w.node.classList.contains("max")) return;
    e.preventDefault();
    focus(w);
    const r = w.node.getBoundingClientRect(), d = desk.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
    desk.classList.add("busy");
    const move = (m) => {
      if (resize) { w.node.style.width = Math.max(260, r.width + m.clientX - x0) + "px"; w.node.style.height = Math.max(160, r.height + m.clientY - y0) + "px"; }
      else {
        w.node.style.left = Math.min(d.width - 80, Math.max(-r.width + 80, r.left - d.left + m.clientX - x0)) + "px";
        w.node.style.top = Math.min(d.height - 80, Math.max(0, r.top - d.top + m.clientY - y0)) + "px";
      }
    };
    const up = () => { desk.classList.remove("busy"); removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
  }

  // win opens a window; content is a node, or an app item for a live preview.
  function win(id, title, content, opts = {}) {
    const old = wins.find((w) => w.id === id);
    if (old) return restore(old);
    const d = desk.getBoundingClientRect();
    const small = d.width < 700;
    const W = opts.w || Math.min(720, d.width - 140), H = opts.h || Math.min(480, d.height - 110);
    const w = { id, title, min: false, item: content && content.id && content.title ? content : null };
    const body = el("div", { class: "body" + (w.item ? "" : " doc"), onpointerdown: () => { if (w.item && !w.stop) restore(w); } });
    w.body = body;
    const bar = el("div", { class: "tb", onpointerdown: (e) => { if (e.target === bar || e.target.tagName === "B") drag(w, e, false); }, ondblclick: () => w.node.classList.toggle("max") },
      el("b", {}, title),
      w.item ? el("a", { href: w.item.open, target: "_blank", rel: "noopener", title: "Open the real app" }, "Open ↗") : null,
      w.item ? el("button", { type: "button", title: "Details", onclick: () => SlopCatalog.viewer.open(w.item) }, "ⓘ") : null,
      el("button", { type: "button", title: "Minimize", onclick: () => minimize(w) }, "–"),
      el("button", { type: "button", title: "Maximize", onclick: () => w.node.classList.toggle("max") }, "□"),
      el("button", { class: "x", type: "button", title: "Close", onclick: () => close(w) }, "×"));
    w.node = el("section", { class: "win" + (small ? " max" : ""), role: "dialog", "aria-label": title,
      style: `left:${120 + (cascade % 8) * 28}px;top:${16 + (cascade % 8) * 24}px;width:${W}px;height:${H}px`,
      onpointerdown: () => focus(w) }, bar, body, el("div", { class: "grip", onpointerdown: (e) => drag(w, e, true) }));
    cascade++;
    desk.insertBefore(w.node, document.querySelector("#task"));
    wins.push(w);
    if (w.item) w.stop = live(body, w.item, "desktop");
    else body.append(content);
    focus(w);
    budget(w);
    keep();
  }

  const openApp = (item) => win("app:" + item.id, item.title, item);
  const byId = new Map(catalog.items.map((i) => [i.id, i]));

  // The address remembers the open app windows (?w=a,b), for links.
  function keep() {
    const u = new URL(location.href);
    const ids = wins.filter((w) => w.item).map((w) => w.item.id);
    if (ids.length) u.searchParams.set("w", ids.join(",")); else u.searchParams.delete("w");
    history.replaceState(history.state, "", u);
  }

  function explorer(filter, title) {
    const grid = el("div", { class: "explorer" });
    const search = el("input", { type: "search", placeholder: "Filter", "aria-label": "Filter", oninput: () => fill() });
    const fill = () => grid.replaceChildren(search, ...catalog.items.filter((i) => (!filter || filter(i)) && matches(i, search.value)).map((i) =>
      el("button", { class: "ico", type: "button", title: i.description, ondblclick: () => openApp(i), onkeydown: (e) => { if (e.key === "Enter") openApp(i); } }, pic(i), el("span", {}, i.title))));
    fill();
    return grid;
  }

  function readme() {
    return el("div", {},
      el("h3", { style: "margin-top:0" }, "Read me"),
      el("p", {}, `${catalog.count} single-file HTML apps from slop.boutique, as windows. Each app window runs the app's own HTML in a sandbox, without slop's runtime: model calls, shared data and rooms work only in the real app (Open ↗).`),
      el("p", {}, `At most ${MAX_LIVE} app windows run at once; the others pause until you click them. Minimized windows stop.`),
      el("p", {}, "Start (or ⌘K / Ctrl K) finds any app. Double-click an icon to open it; drag title bars; the corner resizes."),
      el("p", {}, "Other ways to look at the same catalog: ", views.filter((v) => v.id !== "desktop").map((v, k) => [k ? ", " : "", el("a", { href: v.path }, v.title)]), "."));
  }

  // --- the start menu ---------------------------------------------------------
  let sel = 0, shown = [];
  function startMenu(open) {
    menu.hidden = open === undefined ? !menu.hidden : !open;
    if (menu.hidden) return;
    const input = el("input", { type: "search", placeholder: "Search apps", "aria-label": "Search apps", oninput: () => { sel = 0; draw(); }, onkeydown: (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 1); draw(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
      else if (e.key === "Enter" && shown[sel]) { openApp(shown[sel]); startMenu(false); }
      else if (e.key === "Escape") startMenu(false);
    } });
    const list = el("ul");
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      shown = q ? catalog.items.map((i) => [fuzzy(i.title, q), i]).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).slice(0, 30).map(([, i]) => i) : catalog.items;
      list.replaceChildren(...shown.map((i, k) => el("li", { class: k === sel ? "sel" : "", onclick: () => { openApp(i); startMenu(false); } },
        i.title, el("small", {}, i.free ? bytes(i.bytes) : "subscribers"))));
    };
    menu.replaceChildren(input,
      el("h4", {}, "Places"),
      el("ul", {}, el("li", { onclick: () => { win("all", "All apps", explorer(null)); startMenu(false); } }, "All apps"),
        el("li", { onclick: () => { win("readme", "Read me", readme(), { w: 460, h: 340 }); startMenu(false); } }, "Read me")),
      el("h4", {}, "Apps, newest first"), list);
    draw();
    input.focus();
  }
  document.querySelector("#start").onclick = () => startMenu();
  desk.addEventListener("pointerdown", (e) => { if (!menu.hidden && !menu.contains(e.target) && e.target.id !== "start") startMenu(false); });

  function taskbar() {
    tasks.replaceChildren(...wins.map((w) => el("button", { type: "button", class: w.node.classList.contains("focus") && !w.min ? "on" : "",
      title: w.title, onclick: () => { if (w.min || !w.node.classList.contains("focus")) restore(w); else minimize(w); } }, w.title)));
  }

  // --- the desktop ------------------------------------------------------------
  const icon = (label, picEl, run) => el("button", { class: "ico", type: "button", ondblclick: run, onkeydown: (e) => { if (e.key === "Enter") run(); } }, picEl, el("span", {}, label));
  const tile = (txt) => el("div", { class: "pic" }, txt);
  document.querySelector("#icons").replaceChildren(
    icon("All apps", tile("▦"), () => win("all", "All apps", explorer(null))),
    icon("Games", tile("◆"), () => win("games", "Games", explorer((i) => i.tags.some((t) => /game/.test(t))))),
    icon("Studios", tile("✎"), () => win("studios", "Studios", explorer((i) => /studio|workbench|ide/i.test(i.title)))),
    icon("Read me", tile("?"), () => win("readme", "Read me", readme(), { w: 460, h: 340 })),
    ...catalog.items.filter((i) => i.free).slice(0, 10).map((i) => icon(i.title, pic(i), () => openApp(i))));
  document.querySelector("#note").textContent = `${catalog.count} apps · double-click to open`;
  const tick = () => { document.querySelector("#clock").textContent = new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); };
  tick();
  setInterval(tick, 15000);
  window.addEventListener("catalog:viewer", (e) => { desk.classList.toggle("busy", e.detail.open); });

  const ws = (new URLSearchParams(location.search).get("w") || "").split(",").filter((id) => byId.has(id));
  if (ws.length) ws.forEach((id) => openApp(byId.get(id)));
  else win("readme", "Read me", readme(), { w: 460, h: 340 });
})();
</script>
</body>
</html>
