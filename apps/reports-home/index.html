<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6d6a64; --line: #e3dfd6; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --fg: #e9e6df; --muted: #a8a49b; --line: #34333a; --card: #1f1f23; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .sp { flex: 1; }
  .btn { padding: 7px 14px; border: 1px solid var(--fg); border-radius: 6px; color: var(--bg); background: var(--fg); font: 600 14px system-ui, sans-serif; cursor: pointer; }
  input.in { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; width: 240px; max-width: 100%; }
  ul { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  li { border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li a { display: flex; gap: 14px; align-items: baseline; padding: 12px 16px; color: inherit; text-decoration: none; flex-wrap: wrap; }
  li a:hover .t { text-decoration: underline; }
  .t { font-weight: 600; font-size: 16px; flex: 1 1 260px; min-width: 0; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; }
  .lv { border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; }
  .empty { color: var(--muted); padding: 10px 0; }
  .note { color: var(--muted); font-size: 13px; margin-top: 32px; line-height: 1.6; }
  code { font: 12.5px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Reports</h1>
    <span class="sp"></span>
    <input class="in" id="q" placeholder="find a report" spellcheck="false" aria-label="find a report">
  </header>
  <div id="out"><p class="empty">Loading…</p></div>
  <p class="note">Each report is shared on its own: open it and use <b>Share</b>, or
    <code>scripts/reports/publish.py link &lt;id&gt; --days 7</code>. A link gives the person who opens it
    view access until you revoke the link. Publish with
    <code>scripts/reports/publish.py publish report.md</code>.</p>
</main>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; kids.forEach(k => k != null && e.append(k)); return e; };
  // This page runs on a sandbox origin; reports open on the live host that framed it.
  const host = new URLSearchParams(location.search).get('parent') || '';
  const reportURL = (id) => host + '/r/' + encodeURIComponent(id);

  const slop = window.claude ? await claude.use('slop').catch(() => null) : null;
  const visitor = slop ? await slop.visitor().catch(() => null) : null;
  if (!slop || !slop.stores || !slop.stores.list) { $('out').replaceChildren(el('p', 'empty', 'Open this page on slop to see your reports.')); return; }
  if (!visitor || visitor.guest) {
    const b = el('button', 'btn', 'Sign in'); b.onclick = () => slop.signIn();
    $('out').replaceChildren(el('p', 'empty', 'Sign in to see your reports. A report shared with you by a link opens from that link.'), b);
    return;
  }
  // The stores of type report this person can open, each with the title in
  // its report/meta, read as this person (slop.stores.list, SLOP3-016).
  let reports = [];
  try { reports = await slop.stores.list({ type: 'report', title: 'report/meta' }); }
  catch (e) { $('out').replaceChildren(el('p', 'empty', 'Your reports could not be listed: ' + (e.message || e))); return; }

  const said = { view: 'can view', interact: 'can edit', admin: 'admin', owner: 'yours' };
  const when = (t) => new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  function row(r) {
    const a = el('a', '', el('span', 't', r.title || r.id), el('span', 'meta', el('span', 'lv', said[r.level] || r.level), el('span', '', when(r.createdAt)), el('span', '', r.id)));
    a.href = reportURL(r.id); a.target = '_top';
    return el('li', '', a);
  }
  function render() {
    const q = $('q').value.trim().toLowerCase();
    const hit = (r) => !q || (r.title || '').toLowerCase().includes(q) || r.id.includes(q);
    const mine = reports.filter(r => r.mine && hit(r)), shared = reports.filter(r => !r.mine && hit(r));
    const section = (title, list, none) => [el('h2', '', title + (list.length ? ' · ' + list.length : '')), list.length ? el('ul', '', ...list.map(row)) : el('p', 'empty', none)];
    const parts = section('Yours', mine, q ? 'No report of yours matches.' : 'No reports yet.');
    if (shared.length || q) parts.push(...section('Shared with you', shared, 'Nothing shared matches.'));
    $('out').replaceChildren(...parts);
  }
  $('q').addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
